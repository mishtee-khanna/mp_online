<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
        }
        table{
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 8px (0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td{
            padding: 12px 15px;
            text-align: left;
        }
        th{
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        tr{
            border-bottom: 1px solid #dddddd;
        }
        tr:nth-of-type{
            background-color: #f9f9f9;
        }
        tr:last-of-type{
            border-bottom: 2px solid #4caf50;
        }
        tr:hover{
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr>

        </tr>

            <td>#1026</td>
            <td>Clara Oswald</td>
            <td>Data Analyst</td>
            <td>Analytics</td>
            <td>On Leave</td>
        </tr>
        <tr>
            <td>#1027</td>
            <td>David Lightman</td>

        </tr>
        <tr>

        </tr>
    </tbody>
</table>
</body>
</html>
